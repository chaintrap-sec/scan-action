# Copy to consumer repo: .github/workflows/chaintrap.yml

name: Chaintrap
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: chaintrap-sec/scan-action@v1.4.0
        id: chaintrap

      - uses: github/codeql-action/upload-sarif@9f79dc6d9c6f86b98b12a5d675b21943e316e423 # v3.28.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: ${{ steps.chaintrap.outputs.sarif-file }}
          category: chaintrap
