# Chaintrap Guard — copy to ~/.config/chaintrap-guard/config.yml

paranoid: false
strict: false
trusted_packages: []
host: local

# Default when Chaintrap Watch is installed: %LOCALAPPDATA%\ChaintrapWatchApp\osv_static_scan.sqlite
