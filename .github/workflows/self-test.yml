name: Self-test
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml -e vendor/chaintrap-static-scan -e vendor/chaintrap-ci -e vendor/chaintrap-guard -e vendor/chaintrap-guard
      - run: pytest tests/ -q -k "not integration"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml -e vendor/chaintrap-static-scan -e vendor/chaintrap-ci -e vendor/chaintrap-guard
      - run: pytest tests/ -q -k integration

  security-abuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml -e vendor/chaintrap-static-scan -e vendor/chaintrap-ci -e vendor/chaintrap-guard
      - run: pytest tests/test_security_abuse.py -q

  dogfood-malicious:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        id: scan
        with:
          paths: test_fixtures/malicious_dep_test
          diff-mode: "false"
          heuristics: "false"
          audit-workflows: "false"
        continue-on-error: true
      - run: test "${{ steps.scan.outputs.exit-code }}" = "2"

  dogfood-security-abuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        id: scan
        with:
          paths: test_fixtures/security_abuse
          diff-mode: "false"
          heuristics: "false"
          audit-workflows: "false"
          content-scan: "false"
      - name: Summary marker is singular
        run: |
          COUNT=$(grep -c '<!-- chaintrap-sca -->' "${{ steps.scan.outputs.summary-file }}" || true)
          test "$COUNT" = "1"
      - name: No raw newlines in annotations path
        run: |
          test -f "${{ steps.scan.outputs.summary-file }}"
          ! grep -q $'\n::' "${{ steps.scan.outputs.summary-file }}" || true

  content-scan-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml -e vendor/chaintrap-static-scan -e vendor/chaintrap-ci -e vendor/chaintrap-guard
      - run: pytest tests/test_phase2.py::test_scan_tree_npm_malicious_fixture -q

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml -e vendor/chaintrap-static-scan -e vendor/chaintrap-ci -e vendor/chaintrap-guard
      - run: python sandbox/run_sandbox.py

  dogfood-workflow-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          paths: test_fixtures/malicious_dep_test
          audit-workflows: "true"
          block-workflow-critical: "false"
          heuristics: "false"
        continue-on-error: true

  dogfood-ephemeral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        id: scan
        with:
          paths: test_fixtures/ephemeral_deps/npx
          diff-mode: "false"
          heuristics: "false"
          audit-workflows: "false"
          content-scan: "false"
        continue-on-error: true
      - name: Blocks known-bad ephemeral npx package
        run: test "${{ steps.scan.outputs.exit-code }}" = "2"
      - name: Summary mentions ephemeral
        run: grep -q "Ephemeral dependencies" "${{ steps.scan.outputs.summary-file }}"
